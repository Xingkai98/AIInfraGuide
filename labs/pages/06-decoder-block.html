  <!--
    Two build-time facts this document depends on, both learned in the
    scaffolding ticket and carried by every lab page since:

      * The no-index marker must wrap the whole document. On a bare <meta> tag
        Pagefind ignores it and indexes the page anyway.
      * Asset paths are relative to the SERVED location, not to this source
        file: scripts/build-labs.mjs flattens labs/pages/*.html to
        public/labs/*.html, so this page lands beside assets/ and must use
        ./assets/… — a ../ would 404 the whole engine.

    The two figures at the top are the exception, and they are why that rule is
    stated as "assets" rather than "everything": they are `public/` images, not
    lab assets. They are still written RELATIVE — `../images/…` — because
    `public/labs/` and `public/images/` are siblings in both the staged tree and
    `dist/`, so `../images/…` resolves to the same file in both. A site-root path
    (`/AIInfraGuide/images/…`) would be correct in the browser and wrong at build
    time: `scripts/build-labs.mjs` resolves every non-external href/src against
    the filesystem, so a leading slash is read as an absolute path and fails the
    build with "references assets that do not exist after staging".

    The page holds a trace SET and a configuration. Every algorithmic decision —
    state reconstruction, layout, formula tiers, playback — lives in the engine;
    the four teaching panels are view components under assets/engine/views/, and
    the parameter account is drawn by the ledger component L05 shipped.
  -->

    <!-- KaTeX is vendored, never a CDN: a lab page must make zero external requests. -->
    <script src="./assets/vendor/katex/katex.min.js"></script>
    <script src="./assets/engine/trace-model.js"></script>

    <!--
      The whole trace set — the manifest plus every configuration it names — is
      substituted here at build time (see the trace-set step in
      scripts/build-labs.mjs). The manifest is written by the generator, so the
      sliders' positions and the traces behind them are defined in one place and
      cannot drift apart: a configuration with no trace is unreachable by
      construction.
    -->
    <!-- traces:decoder-block -->

    <script>
      (function () {
        'use strict';

        var SET = 'decoder-block';
        var traces = window.LabTraces || {};
        var manifest = (window.LabTraceSets || {})[SET];
        var esc = LabEngine.formula.escapeText;

        var paramsHost = document.getElementById('lab-params');
        var readoutHost = document.getElementById('lab-readout');
        var stage = document.getElementById('lab-stage');
        var banner = document.getElementById('lab-banner');

        if (!manifest || !traces[manifest.default]) {
          stage.textContent = 'trace 未加载：本页的 trace 集合占位符没有被构建脚本替换。';
          return;
        }

        /* ------------------------------------------------------------- numbers
         *
         * Every value below comes out of the trace's own meta blocks. The only
         * transformation is choosing how wide a number reads on screen — nothing
         * here computes a parameter count, a normalization statistic or a
         * gradient norm, which is what keeps "every number on the page is the
         * output of the generator" literally true.
         */
        function num(v, digits) {
          if (v === null || v === undefined) return '—';
          if (typeof v !== 'number') return String(v);
          var s = v.toPrecision(digits || 4);
          return s.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
        }

        function metric(label, value, cls, attr) {
          return '<span class="l04-metric' + (cls ? ' ' + cls : '') + '"' +
                 (attr ? ' data-metric="' + esc(attr) + '"' : '') + '>' +
                 '<b>' + esc(value) + '</b>' + esc(label) + '</span>';
        }

        /* ----------------------------------------------------------- the configs
         *
         * A slider position is matched to a trace by reading the trace's OWN
         * `meta.config` — never by parsing an id. The ids the manifest lists are
         * for humans; the page asks "which generated trace has d_model=64,
         * d_ff=176?" and a name that happens to encode that is irrelevant. A
         * naming convention would have been a second source of truth for the
         * same fact, and the first thing to drift.
         */
        var CONFIG_CACHE = {};
        function traceFor(values) {
          var key = values.d_model + '|' + values.d_ff;
          if (CONFIG_CACHE[key]) return CONFIG_CACHE[key];
          var found = null;
          manifest.traces.forEach(function (name) {
            var t = traces[name];
            if (!t || found) return;
            var c = t.meta.config;
            if (c.d_model === values.d_model && c.d_ff === values.d_ff) {
              found = { name: name, trace: t };
            }
          });
          CONFIG_CACHE[key] = found;
          return found;
        }

        function valuesFromTrace(trace) {
          var c = trace.meta.config;
          return { d_model: c.d_model, d_ff: c.d_ff };
        }

        /* ------------------------------------------------------------ readout
         *
         * The five numbers the ticket's criteria are about, printed beside the
         * sliders so the sliders' effect is readable without scrolling into the
         * panels.
         *
         * `data-metric` on each item is the acceptance harness's handle: it
         * reads these back off the DOM and compares them to the trace, so a page
         * that printed a number no trace contains fails the harness.
         */
        function readout(trace) {
          var par = trace.meta.params;
          var cfg = trace.meta.config;
          var nc = trace.meta.norm_contrast;
          var pre = nc.modes[0], post = nc.modes[1];

          /* A list of magnitudes, not an average: the segment's size is what a
           * reader is judging. */
          var segs = par.segments.map(function (s) {
            return '<span class="l04-metric move" data-seg="' + esc(s.id) + '">' +
              '<b data-metric="seg_' + esc(s.id) + '">' +
              par.bytes[s.id].toLocaleString('en-US') + '</b>' + esc(s.label) +
              '</span>';
          }).join('');

          var html = '<div class="l04-group">' +
            '<span class="l04-group-t">本 block 的参数量（个）</span>' +
            segs +
            metric('合计 · 4d²+3·d·d_ff+4d', par.elements.toLocaleString('en-US'),
                   'good', 'params_total') +
            '</div>';

          /* The same account priced into bytes — the tutorial's `3.7 §8`. Both
           * numbers are on the page because they answer different questions,
           * and the ledger bar below draws THIS one. */
          html += '<div class="l04-group">' +
            '<span class="l04-group-t">按 fp16 计价（' + par.deploy_bytes +
            ' 字节/参数）</span>' +
            metric('SwiGLU FFN', par.priced.ffn.toLocaleString('en-US') + ' B',
                   'warn', 'priced_ffn') +
            metric('注意力', par.priced.attn.toLocaleString('en-US') + ' B',
                   'move', 'priced_attn') +
            metric('合计', par.priced_total.toLocaleString('en-US') + ' B',
                   'good', 'priced_total') +
            '</div>';

          /* The FFN's share is the number the tutorial's §6.2 works out by hand
           * for LLaMA-2 (66.8%), so it is the one worth printing: a reader
           * changing d_ff is watching this move. */
          var ffnShare = par.bytes.ffn / par.elements;
          html += '<div class="l04-group">' +
            '<span class="l04-group-t">分项占比</span>' +
            metric('SwiGLU FFN', (ffnShare * 100).toFixed(1) + '%', 'warn', 'ffn_share') +
            metric('注意力', (par.bytes.attn / par.elements * 100).toFixed(1) + '%',
                   'move', 'attn_share') +
            metric('d_ff / d_model', (cfg.d_ff / cfg.d_model).toFixed(2), 'flat', 'dff_ratio') +
            '</div>';

          /* The two LN statistics the second criterion is about: how many
           * per-token means there are, and the fact that they differ. */
          var ln = trace.steps[1].ln;
          html += '<div class="l04-group">' +
            '<span class="l04-group-t">LayerNorm（第 1 处）</span>' +
            metric('μ 的个数（= token 数）', String(ln.mu.length), 'move', 'mu_count') +
            metric('μ 的极差', num(ln.mu_spread, 3), 'move', 'mu_spread') +
            metric('行 std 范围', num(ln.row.std_min, 4) + '…' + num(ln.row.std_max, 4),
                   'good', 'row_std') +
            '</div>';

          /* The residual counterexamples: how many shapes were tried, and how
           * many of them failed SILENTLY. That second number is the one the
           * first criterion is really about. */
          var res = trace.steps[5].residual;
          html += '<div class="l04-group">' +
            '<span class="l04-group-t">残差 shape 对照（第 1 处）</span>' +
            metric('试过的右操作数', String(res.cases.length), 'flat', 'res_cases') +
            metric('静默广播', String(res.silent.length), 'warn', 'res_silent') +
            metric('抛异常', String(res.raised.length), 'good', 'res_raised') +
            '</div>';

          /* The Pre/Post contrast's headline. */
          html += '<div class="l04-group">' +
            '<span class="l04-group-t">Pre / Post-Norm（深度 ' + nc.depths[nc.depths.length - 1] + '）</span>' +
            metric('梯度放大 Pre', num(pre.grad_in_over_out, 4) + '×', 'move', 'grad_pre') +
            metric('梯度放大 Post', num(post.grad_in_over_out, 4) + '×', 'warn', 'grad_post') +
            metric('残差流 RMS Pre', num(pre.residual_rms[0], 3) + '→' +
                   num(pre.residual_rms[pre.residual_rms.length - 1], 3), 'move', 'rms_pre') +
            metric('残差流 RMS Post', num(post.residual_rms[0], 4) + '（恒定）',
                   'flat', 'rms_post') +
            '</div>';

          return '<div class="l04-readout">' + html + '</div>';
        }

        /* The ledger's segment declarations. The trace publishes its own
         * (`meta.params.segments`) with the formulas the parameter count is
         * identified by (`4d²`, `3·d·d_ff`, `4d`); the ledger DRAWS byte
         * quantities, so the third formula is the memory one from `3.7 §8`
         * instead. Declaring them here rather than in the trace is deliberate:
         * they are the page's statement about what it is showing, and the trace
         * has no way to know which of its two accounts the bar was handed. */
        var PARAM_SEGMENTS = [
          { id: 'attn', label: '注意力（4 个 d×d 投影）', color: '#5b8def',
            formula: '4\\,d^2 \\times 2\\,\\mathrm{B}' },
          { id: 'ffn', label: 'SwiGLU FFN（3 个 d×d_{ff} 矩阵）', color: '#b45309',
            formula: '3\\,d\\,d_{ff} \\times 2\\,\\mathrm{B}' },
          { id: 'norm', label: 'LayerNorm（两组 γ、β）', color: '#0f7b52',
            formula: '4\\,d \\times 2\\,\\mathrm{B}' }
        ];

        /* --------------------------------------------------------------------
         * A LaTeX string rendered for PROSE (a caption), not for a formula
         * panel.
         *
         * A caption is plain text by contract — `trace-model.js` warns when a
         * narration string contains a LaTeX command, precisely because it would
         * render as literal backslashes. The ledger's caption is a sibling of
         * that: the first version of this page interpolated
         * `meta.params.formula` into it directly and the screenshot came back
         * reading `P_{\mathrm{block}} = 4d^2 + 3d\,d_{ff} + 4d` with the
         * backslashes showing. KaTeX is already loaded, so the fix is to render
         * it rather than to avoid it.
         */
        function tex(texStr) {
          if (!texStr) return '';
          return LabEngine.formula.renderInline(texStr);
        }

        /* ------------------------------------------------------ the panels */
        var player = null;
        var ledgerView = null;
        var current = null;

        /* The ledger's cost model for L04's parameter account.
         *
         * Registered with the SAME component L05 shipped — `LabEngine.ledger` —
         * so the stacked bar, its byte formatting, its table and its hover
         * wiring are not re-implemented here. What is L04's is the FORMULA, and
         * that arrives as this pure function: the tutorial's `3.7 §6.1`
         * expression, in `d_model` and `d_ff`.
         *
         * Note what the model does NOT need: a phase, a sequence length, a
         * layer count. L04's account is a single block's weights and nothing
         * else, which is the reason this page declares `meta.params` instead of
         * reusing `trace.ledger` — that block's lint requires L05's KV-config
         * keys on every step (see the generator's docstring and
         * `labs/traces/README.md`).
         */
        function PARAM_MODEL(segments, unit, deployBytes) {
          return {
            id: 'decoder-block-params',
            segments: segments,
            unit: unit,
            predict: function (cfg) {
              var d = cfg.d_model, dff = cfg.d_ff;
              /* Parameter COUNTS, priced into bytes by the multiplier the trace
               * declares (`3.7 §8`: 显存 = 参数量 × 每参数字节数). The ledger is a
               * memory ledger — handing it a count is what produced
               * "50,432 个参数 · 49.3 KiB" on the first run. */
              var counts = { attn: 4 * d * d, ffn: 3 * d * dff, norm: 2 * 2 * d };
              var out = {};
              Object.keys(counts).forEach(function (k) {
                out[k] = counts[k] * (cfg.deploy_bytes || deployBytes);
              });
              return out;
            },
            /* Properties of the formulas, not of one evaluation. A formula
             * that is merely self-consistent while being wrong passes the
             * per-step check and fails here — or vice versa, which is why both
             * run. */
            properties: [
              {
                /* Every property states its config in FULL, including the
                 * multiplier — `predict` defaults `deploy_bytes` from the
                 * closure, so a property that overrode only the dimensions
                 * would still be priced correctly, and one that overrode the
                 * multiplier is what the "pricing halves" property below
                 * tests. Leaving it implicit in the first two is deliberate:
                 * they are about the SHAPE of the account, not its dtype. */
                name: 'd_model 翻倍 → 注意力分项精确 ×4（4d²），其余两项按线性',
                run: function (p) {
                  var a = p({ d_model: 64, d_ff: 176 });
                  var b = p({ d_model: 128, d_ff: 176 });
                  return {
                    ok: b.attn === 4 * a.attn && b.ffn === 2 * a.ffn && b.norm === 2 * a.norm,
                    detail: a.attn.toLocaleString() + ' → ' + b.attn.toLocaleString() +
                            '（注意力）；' + a.ffn.toLocaleString() + ' → ' +
                            b.ffn.toLocaleString() + '（FFN）'
                  };
                }
              },
              {
                name: 'd_ff 翻倍 → FFN 分项精确 ×2，其余不动',
                run: function (p) {
                  var a = p({ d_model: 64, d_ff: 176 });
                  var b = p({ d_model: 64, d_ff: 352 });
                  return {
                    ok: b.ffn === 2 * a.ffn && b.attn === a.attn && b.norm === a.norm,
                    detail: a.ffn.toLocaleString() + ' → ' + b.ffn.toLocaleString() + ' 个参数'
                  };
                }
              },
              {
                name: 'd_ff = (4/3)·d_model 时 FFN 与注意力持平；此时 FFN 占比 50%',
                run: function (p) {
                  /* SwiGLU has three matrices where a plain FFN has two, so the
                   * equal-PARAMETER point is `3·d·d_ff = 4d²`, i.e. `d_ff =
                   * (4/3)d`. The tutorial's `(8/3)d` is the ratio that keeps the
                   * FLOPs equal against a two-matrix FFN with `d_ff = 4d`
                   * (`2·d·4d = 2·3·d·d_ff` ⇒ `d_ff = (8/3)d`) — a different
                   * statement about a different quantity. The property says
                   * which one it is testing; conflating the two is how a reader
                   * comes away believing `(8/3)d` equalizes the parameters. */
                  var eq = p({ d_model: 96, d_ff: 128 });
                  var eightThirds = p({ d_model: 96, d_ff: 256 });
                  return {
                    ok: eq.ffn === eq.attn && eightThirds.ffn === 2 * eightThirds.attn,
                    detail: 'd_ff = (4/3)d = 128 时 FFN=' + eq.ffn.toLocaleString() +
                            ' 与注意力=' + eq.attn.toLocaleString() + ' 持平；' +
                            'd_ff = (8/3)d = 256 时 FFN 是注意力的 ' +
                            (eightThirds.ffn / eightThirds.attn) + ' 倍'
                  };
                }
              },
              {
                name: 'fp16 → fp8 → 每个分项的字节数精确减半，参数量不动（3.7 §8）',
                run: function (p) {
                  var a = p({ d_model: 64, d_ff: 176, deploy_bytes: 2 });
                  var b = p({ d_model: 64, d_ff: 176, deploy_bytes: 1 });
                  return {
                    ok: a.attn === 2 * b.attn && a.ffn === 2 * b.ffn &&
                        a.norm === 2 * b.norm && b.attn > 0,
                    detail: b.ffn.toLocaleString() + ' B → ' + a.ffn.toLocaleString() +
                            ' B（SwiGLU 分项）'
                  };
                }
              },
              {
                name: '各分项之和 == 该配置下的总字节数',
                run: function (p) {
                  var b = p({ d_model: 64, d_ff: 176 });
                  var sum = segments.reduce(function (a, s) { return a + b[s.id]; }, 0);
                  return { ok: sum === b.attn + b.ffn + b.norm,
                           detail: sum.toLocaleString() + ' B' };
                }
              }
            ]
          };
        }

        /* ------------------------------------------- the account's self-check
         *
         * `LabEngine.ledger.check()` cannot be used here, and the reason is
         * worth stating because a page that quietly reported its verdict would
         * be reporting nothing:
         *
         *   * it iterates the steps that carry `step.ledger`, and L04's account
         *     lives on `step.params` (see the generator's docstring for why L04
         *     does not declare `trace.ledger`). It therefore finds ZERO steps
         *     and its "0 步不一致" is vacuous;
         *   * its four control models are L05's — KV Cache missing its factor
         *     of 2, missing the layer count, double-counting layers, fp32
         *     pricing. None of them is wrong about a parameter count, so all
         *     four "pass" here and `missedControls` is the whole list.
         *
         * So L04 runs the same three checks over its OWN account: every step's
         * published bytes against the model's prediction, the model's declared
         * scaling properties, and a control group of deliberately wrong models
         * that must be caught. The shape is `ledger.check()`'s on purpose — the
         * page reports component-level verdicts in the component's own terms —
         * and the panel says which parts are the component's and which are this
         * page's.
         */
        function paramSelfCheck(trace, model) {
          var steps = trace.steps;
          var stepRows = [];
          var stepFailures = 0;

          steps.forEach(function (s) {
            var want = s.params.priced;
            var cfg = s.params.config;
            var got, mismatch;
            try {
              got = model.predict(cfg);
              mismatch = Object.keys(want).filter(function (k) { return got[k] !== want[k]; });
            } catch (err) {
              /* A model that throws on a config the trace actually ran is a
               * failure of the model, and has to be reported as one. Letting it
               * propagate would take the panel down and turn a red verdict into
               * no verdict at all. */
              mismatch = ['抛出 ' + err.message];
            }
            if (mismatch.length) stepFailures++;
            stepRows.push({ label: s.id, ok: mismatch.length === 0,
                            detail: mismatch.join('；') });
          });

          var propRows = (model.properties || []).map(function (p) {
            var r;
            try { r = p.run(model.predict); }
            catch (err) { r = { ok: false, detail: '抛出 ' + err.message }; }
            return { label: p.name, ok: !!r.ok, detail: r.detail || '' };
          });

          /* The control group. Each broken model is wrong in a way that is easy
           * to write by accident, and each is wrong about ONE segment — so a
           * per-step check that looked only at the total would miss them all. */
          var CONTROLS = {
            '注意力用了 d² 而不是 4d²（漏掉四个投影）': function (cfg) {
              return shallow(model.predict(cfg),
                             { attn: cfg.d_model * cfg.d_model * (cfg.deploy_bytes || 2) });
            },
            'SwiGLU 只算两个矩阵（漏掉 ×3）': function (cfg) {
              var b = model.predict(cfg);
              return shallow(b, { ffn: Math.round(b.ffn / 3) });
            },
            'LayerNorm 只算一组 γ、β（漏掉 ×2）': function (cfg) {
              var b = model.predict(cfg);
              return shallow(b, { norm: Math.round(b.norm / 2) });
            },
            '把 d_ff 与 d_model 写反': function (cfg) {
              return shallow(model.predict(cfg),
                             { ffn: 3 * cfg.d_ff * cfg.d_ff * (cfg.deploy_bytes || 2) });
            }
          };
          function shallow(base, over) {
            var out = {};
            Object.keys(base).forEach(function (k) { out[k] = base[k]; });
            Object.keys(over).forEach(function (k) { out[k] = over[k]; });
            return out;
          }
          var controlRows = Object.keys(CONTROLS).map(function (name) {
            var caughtBySteps = 0;
            steps.forEach(function (s) {
              var got;
              try { got = CONTROLS[name](s.params.config); }
              catch (err) { caughtBySteps++; return; }
              if (Object.keys(s.params.priced).some(function (k) {
                    return got[k] !== s.params.priced[k];
                  })) caughtBySteps++;
            });
            var caughtByProps = (model.properties || []).filter(function (p) {
              var r;
              try { r = p.run(CONTROLS[name]); } catch (err) { return true; }
              return !r.ok;
            }).length;
            return {
              label: name,
              caught: caughtBySteps > 0 || caughtByProps > 0,
              detail: '逐步对拍抓到 ' + caughtBySteps + '/' + steps.length + ' 步，' +
                      '缩放性质抓到 ' + caughtByProps + '/' +
                      (model.properties || []).length + ' 条'
            };
          });
          var missed = controlRows.filter(function (r) { return !r.caught; });

          return {
            steps: stepRows, stepFailures: stepFailures,
            properties: propRows,
            propertyFailures: propRows.filter(function (r) { return !r.ok; }).length,
            controls: controlRows, missedControls: missed,
            /* Conclusive *and* green, or not green at all. */
            passed: stepFailures === 0 && missed.length === 0 &&
                    propRows.every(function (r) { return r.ok; })
          };
        }

        function mount(name) {
          var trace = traces[name];
          current = name;
          ledgerView = null;
          if (player) { try { player.destroy(); } catch (e) { /* already gone */ } }
          stage.innerHTML = '';

          var cfg = trace.meta.config;
          var model = PARAM_MODEL(PARAM_SEGMENTS, 'B', trace.meta.params.deploy_bytes);

          /* --- the replay's parameter account.
           *
           * Mounted BESIDE the engine's panel body, not into it: the engine
           * assigns `host.innerHTML = render(...)` on every paint, which would
           * detach a live view. `[data-panel="params"]` is the section the
           * engine created and never touches again, so appending a sibling body
           * survives repaints. (Same arrangement L05's ledger uses.)
           */
          var paramPanel = {
            id: 'params',
            label: '本 block 的参数量与 fp16 显存（账本组件）',
            render: function (step, ctx) {
              if (!ledgerView) {
                var section = document.querySelector('[data-panel="params"]');
                var host = document.createElement('div');
                host.className = 'lab-panel-bd';
                host.setAttribute('data-l04-ledger-mount', '1');
                section.appendChild(host);
                ledgerView = LabEngine.ledger.bar(host, {
                  segments: PARAM_SEGMENTS,
                  unit: 'B',
                  caption: function () {
                    var p = trace.meta.params;
                    return '第 ' + ctx.cursor + ' 步 · ' + esc(step.title) +
                      ' —— 整个 block 的参数量不随步骤变化，所以这条账本在每一帧都一样：' +
                      '<b>' + p.elements.toLocaleString('en-US') + '</b> 个参数，' +
                      '按 fp16（每参数 ' + p.deploy_bytes + ' 字节）计价为 <b>' +
                      p.priced_total.toLocaleString('en-US') + ' B</b> = ' +
                      p.segments.map(function (s) {
                        return esc(s.label) + ' ' +
                          p.priced[s.id].toLocaleString('en-US') + ' B';
                      }).join(' + ') + '。每个数字都数了两遍：一遍从真实权重的 ' +
                      '<code>arr.size</code>，一遍用 ' + tex(p.formula) + '。' +
                      '滑杆一动，这条账本就地重算。';
                  }
                });
              }
              /* The numbers come from the trace, not the model: this is the
               * replay. The model's job is to be checked against them, which is
               * what the self-check panel below does. The trace's own `priced`
               * is what the bar draws — the model's prediction is compared
               * against it rather than shown in its place. */
              ledgerView.update(step.params.priced);
              ledgerView.root.setAttribute('data-step-id', step.id);
              return '';
            }
          };

          var resPanel = LabEngine.shapeGuard.panel({ id: 'shape-guard' });
          var lnPanel = LabEngine.normAxis.panel({ id: 'norm-axis' });
          var swPanel = LabEngine.swigluPaths.panel({ id: 'swiglu-paths' });
          var ncPanel = LabEngine.normContrast.panel({ id: 'norm-contrast' }, { trace: trace });

          player = LabEngine.lab(trace, {
            mount: stage,
            title: 'Decoder Block：残差 / LayerNorm / SwiGLU',
            lead: '一个完整的 Pre-Norm block，14 步走完：' +
              'x → LN → MHA → +x → LN → SwiGLU → +x。' +
              'd_model=' + cfg.d_model + '，d_ff=' + cfg.d_ff + '，' + cfg.H +
              ' 头 × d_h=' + cfg.d_head + '，N=' + cfg.N + '。' +
              '四个面板分别把这一票的四件事摊开：残差两侧的 shape 与不匹配的后果、' +
              'LayerNorm 的 μ/σ 在哪个轴上、SwiGLU 的三条路径、Pre/Post-Norm 的尺度对照。',
            tier: 'num',
            speed: 1100,
            panels: [resPanel, lnPanel, swPanel, ncPanel, paramPanel],
            tutorial: {
              href: '/AIInfraGuide/prerequisites/transformer/37-transformer-decoder-block完整解析',
              label: '返回教程正文：3.7 Transformer Decoder Block 完整解析'
            }
          });

          /* The teaching panels lead, above the engine's own two-column block,
           * in the order the block's data flow runs. */
          ['shape-guard', 'norm-axis', 'swiglu-paths', 'norm-contrast', 'params']
            .forEach(function (pid) {
              var el = document.querySelector('[data-panel="' + pid + '"]');
              if (!el) return;
              var cls = { 'shape-guard': 'sg', 'norm-axis': 'na', 'swiglu-paths': 'sw',
                          'norm-contrast': 'nc', 'params': 'p' }[pid];
              el.classList.add('lab-' + cls + '-panel');
              document.querySelector('.lab-panel-dag').before(el);
            });

          /* Compact proof panel for the engine's own contracts. It carries the
           * control group, so a green verdict here means something -- see
           * labs/assets/engine/verify.js. */
          var proof = document.createElement('section');
          proof.className = 'lab-panel lab-panel-extra';
          proof.innerHTML = '<div class="lab-panel-hd">' +
            '<span class="lab-panel-t">自检 · 引擎正确性</span>' +
            '<span class="lab-panel-sub">在浏览器里真跑，不是预期值</span></div>' +
            '<div class="lab-panel-bd" style="padding:10px 12px"></div>';
          stage.appendChild(proof);
          LabEngine.verify.panel(proof.querySelector('.lab-panel-bd'), trace, player.index);

          /* --- the L04 self-checks.
           *
           * FIVE of them, because this lab introduced five contract blocks and
           * each is governed by rules in a different file: step.residual
           * (views/shape-guard.js), step.ln (views/norm-axis.js), step.swiglu
           * (views/swiglu-paths.js), meta.norm_contrast
           * (views/norm-contrast.js) and meta.params.
           *
           * The accounting's verdict is `paramSelfCheck` below rather than
           * `LabEngine.ledger.check()`, for the two reasons its docstring
           * records — `check()` reads `step.ledger`, which this trace does not
           * have, so it would report "0 步不一致" over ZERO steps and miss every
           * one of its L05-shaped control models. The panel says so in as many
           * words rather than presenting a vacuous green.
           *
           * The verdicts are collected on `window.__labViewChecks` so
           * scripts/verify-l04.py can read the same objects the page computed
           * rather than re-deriving them. */
          var checks = {};
          function checkSection(title, sub, html, key, value) {
            var sec = document.createElement('section');
            sec.className = 'lab-panel lab-panel-extra';
            sec.innerHTML = '<div class="lab-panel-hd"><span class="lab-panel-t">自检 · ' +
              esc(title) + '</span><span class="lab-panel-sub">' + esc(sub) + '</span></div>' +
              '<div class="lab-panel-bd" style="padding:10px 12px"></div>';
            stage.appendChild(sec);
            sec.querySelector('.lab-panel-bd').innerHTML = html;
            checks[key] = value;
          }

          var led = paramSelfCheck(trace, model);
          checkSection('参数量账本（渲染复用 L05 的 ledger 组件）',
            '逐帧对拍 + 缩放性质 + 对照组',
            '<div class="lab-verdict ' + (led.passed ? 'lab-ok' : 'lab-bad') + '">' +
            '<b>逐步对拍：</b>' + led.steps.length + ' 步，' +
            (led.stepFailures === 0
              ? '<b>0 步不一致</b>（每一帧的三个分项都由 4d²+3dd_ff+4d 从该帧 config 重算' +
                '再按 fp16 计价，与 trace 里从真实权重 <code>arr.size</code> 数出来的字节数' +
                '逐位相同）。'
              : '<b>' + led.stepFailures + ' 步不一致</b>。') +
            '<br><b>缩放性质：</b>' + (led.propertyFailures === 0
              ? led.properties.length + ' 条全部成立 —— 这些是公式的性质，不是某一次求值的结果。'
              : '<b>' + led.propertyFailures + ' 条不成立</b>。') +
            '<br><b>对照组（故意写错的模型）：</b>' + led.controls.length + ' 种，' +
            (led.missedControls.length === 0
              ? '全部被抓到 —— 所以上面的 0 不是对拍写错。'
              : '<b>漏掉 ' + led.missedControls.length + ' 种，这组对拍没有区分力。</b>') +
            '</div>' +
            '<div class="lab-verdict lab-ok" style="margin-top:6px">' +
            '<b>渲染来自组件，公式来自本页：</b>这个面板的堆叠条、字节格式化、表格与悬停' +
            '都由 <code>views/ledger.js</code>（ticket #45）提供，本页没有重写其中任何一个。' +
            '本页提供的是成本模型 <code>predict(config)</code> 与缩放性质。' +
            '<br><b>为什么不用 <code>ledger.check()</code> 的判决：</b>' +
            '它按 <code>step.ledger</code> 找步骤，而 L04 的账本挂在 <code>step.params</code> 上 ' +
            '（<code>trace.ledger</code> 的 lint 要求 L05 的 KV 配置键，' +
            'L04 没有 KV Cache，满足它就得发布一个什么都不指代的行数）。' +
            '所以它对这份 trace 会看到 <b>0 个步骤</b>、报一句空洞的「0 步不一致」，' +
            '而它的四个对照模型全是 KV Cache 的错法，一个都不是参数量的错法。' +
            '上面的三项检查因此是对<b>本页的账本</b>重跑的同一套形状，' +
            '四项破坏也都是参数量的错法 —— 一个绿结论只有在对照组确实翻车时才算数。' +
            '</div>', 'params',
            { stepFailures: led.stepFailures, propertyFailures: led.propertyFailures,
              controls: led.controls.length, missedControls: led.missedControls.map(
                function (c) { return c.label; }),
              steps: led.steps.length, passed: led.passed });

          /* The four pure-lint views. Their verdicts are the same shape, so the
           * harness reads all of them the same way and the panel renders them
           * the same way. */
          [['残差相加的 shape 契约', '契约 lint + 对照组', LabEngine.shapeGuard, 'shapeGuard'],
           ['LayerNorm 轴的契约', '契约 lint + 对照组', LabEngine.normAxis, 'normAxis'],
           ['SwiGLU 路径的契约', '契约 lint + 对照组', LabEngine.swigluPaths, 'swigluPaths'],
           ['Pre/Post-Norm 对照的契约', '契约 lint + 对照组', LabEngine.normContrast,
            'normContrast']].forEach(function (entry) {
            var title = entry[0], sub = entry[1], view = entry[2], key = entry[3];
            var r = view.lint(trace);
            var missed = view.sabotageChecks(trace);
            var total = Object.keys(view.SABOTAGE_CASES).length;
            var verdict = { lintGaps: r.gaps.length, lintWarns: r.warns.length,
                            sabotageTotal: total, sabotageMissed: missed,
                            present: r.present !== false,
                            infos: (r.infos || []).map(function (x) { return x.what; }),
                            passed: r.gaps.length === 0 && missed.length === 0 };
            checkSection(title, sub,
              '<div class="lab-verdict ' + (verdict.passed ? 'lab-ok' : 'lab-bad') + '">' +
              '<b>契约 lint：</b>干净的 trace 报 <b>' + r.gaps.length + '</b> 个 gap、' +
              r.warns.length + ' 个 warn；对照组 ' + total + ' 种破坏' +
              (missed.length
                ? '，<b>漏掉 ' + missed.length + ' 种：' + esc(missed.join('、')) + '</b>'
                : '全部被抓到') + '。' +
              (missed.length ? '' : 'lint 是活的，所以这个 0 有意义。') +
              (verdict.infos.length ? '<br>' + esc(verdict.infos.join(' · ')) : '') +
              '</div>', key, verdict);
          });
          window.__labViewChecks = checks;

          readoutHost.innerHTML = readout(trace);

          /* The player handle, for scripts/verify-l04.py. Exposing it is
           * harmless in production and it is the only way a harness can assert
           * against the same object the page drives rather than a
           * re-implementation of it. */
          window.__p = player;
          window.__labTrace = trace;
          window.__labConfig = name;
          window.__labManifest = manifest;
          window.__labTraces = traces;
          window.__labModel = model;
          return player;
        }

        /* ------------------------------------------------------ the sliders */
        var PARAMS = [
          ['d_model', '模型维度（注意力四个投影的边长）'],
          ['d_ff', 'FFN 中间维度（SwiGLU 三个矩阵的公共边）']
        ];

        function buildParamBar() {
          var cur = valuesFromTrace(traces[current]);
          var html = '<div class="l04-params"><div class="l04-params-row">';
          PARAMS.forEach(function (p) {
            var key = p[0];
            var opts = manifest.params[key];
            var i = opts.indexOf(cur[key]);
            html += '<div class="l04-param">' +
              '<span class="l04-param-label">' + esc(p[1]) + '</span>' +
              '<span class="l04-param-label l04-param-name">' + esc(key) + '</span>' +
              '<input type="range" min="0" max="' + (opts.length - 1) + '" step="1" value="' + i +
                '" data-param="' + esc(key) + '" aria-label="' + esc(p[1]) + '">' +
              '<span class="l04-param-val" data-param-val="' + esc(key) + '">' +
                esc(String(cur[key])) + '</span>' +
              '</div>';
          });
          html += '<span class="l04-param-hint">改动会重新载入对应配置的 trace，' +
            '页面上的数字与五个面板随之变化（' + manifest.traces.length +
            ' 组合法配置，全部由同一个脚本生成）</span>';
          html += '</div><div class="l04-params-note" id="l04-params-note" hidden></div></div>';

          paramsHost.innerHTML = html;
          Array.prototype.forEach.call(
            paramsHost.querySelectorAll('input[data-param]'),
            function (input) {
              input.addEventListener('input', function () {
                var key = input.dataset.param;
                var opts = manifest.params[key];
                var next = valuesFromTrace(traces[current]);
                next[key] = opts[Number(input.value)];
                apply(next);
              });
            }
          );
        }

        function note(msg) {
          var el = document.getElementById('l04-params-note');
          if (!el) return;
          el.hidden = !msg;
          el.textContent = msg || '';
        }

        function apply(values) {
          var found = traceFor(values);
          if (!found) {
            /* Reported rather than silently ignored: a slider that moves and
             * does nothing is worse than one that explains itself. Unreachable
             * today, because the generator emits the full product — every
             * position of every slider has a trace behind it. */
            note('配置 d_model=' + values.d_model + ' d_ff=' + values.d_ff +
                 ' 没有对应的 trace（生成脚本没有产出这一组）。' +
                 '生成器产出的是两个参数的完整笛卡尔积，所以这一格不该是空的。');
            buildParamBar();
            return;
          }
          note('');
          var url = new URL(location.href);
          url.searchParams.set('cfg', found.name);
          url.searchParams.set('step', '0');
          try { history.replaceState(null, '', url); } catch (e) { /* file:// */ }
          mount(found.name);
          buildParamBar();
        }

        /* Deep links: ?cfg= and ?step=, each announced when out of range rather
         * than silently ignored — the same terms the player uses. */
        var query = new URLSearchParams(location.search);
        var messages = [];
        var requestedCfg = query.get('cfg');
        if (requestedCfg && manifest.traces.indexOf(requestedCfg) === -1) {
          messages.push('深链里的 ?cfg=' + requestedCfg + ' 不在本页内联的 ' +
            manifest.traces.length + ' 个配置里，已载入默认配置 ' + manifest.default + '。');
        }
        var startName = requestedCfg && manifest.traces.indexOf(requestedCfg) !== -1
          ? requestedCfg : manifest.default;
        valuesFromTrace(traces[startName]);      // fail fast if a trace is malformed
        mount(startName);
        buildParamBar();

        var requestedStep = query.get('step');
        if (requestedStep !== null) {
          var n = parseInt(requestedStep, 10);
          var len = traces[startName].steps.length;
          if (isNaN(n) || n < 0 || n > len - 1) {
            messages.push('深链里的 ?step=' + requestedStep + ' 超出范围（本配置共 ' +
              len + ' 步），已停在第一步。');
          }
        }
        if (messages.length) {
          banner.hidden = false;
          banner.textContent = messages.join(' ');
        }

        document.getElementById('lab-provenance').innerHTML =
          '本页每个数字都来自一次真实的 numpy / torch 运行，不是手编的演示数据。' +
          'trace 由 <code>labs/traces/decoder_block.py</code> 生成，它对<b>每一组</b>滑杆配置做六件事：' +
          '① 用 numpy 走完整条 block，并与一份<b>独立的 torch 实现</b>逐元素对拍' +
          '（实测最大相对偏差 ~5e-15）；' +
          '② 把 <b>7 种候选右操作数</b>真的加到残差流的左侧操作数上，' +
          '记录每一次的结局 —— 三个静默广播、三个抛异常，异常文本是 numpy 自己的原话；' +
          '③ 把 LayerNorm 的 μ、σ 与归一化后数组的<b>行、列两个方向</b>的统计量都算出来，' +
          '再把沿 token 轴归约的<b>反事实</b>也算一遍 —— 三者缺一，「沿哪个轴」就不可判；' +
          '④ SwiGLU 的三条路径每一步都带全三个权重与三个中间量的 shape，' +
          '逐元素乘还带矩阵里真实的一个位置（a、b 与乘积）；' +
          '⑤ Pre/Post-Norm 用 <b>torch autograd</b> 在深度 1…32 上量出残差流 RMS 与' +
          '梯度回传范数，并在另外两个探针种子上复算一遍要求排序不变；' +
          '⑥ 参数量同时从真实权重的 <code>arr.size</code> 与教程 3.7 §6.1 的闭式各数一遍。' +
          '不通过就拒绝写文件。整个过程还跑一组「故意破坏」的对照组，' +
          '每一种都必须被抓到，否则那份「0 gap」不算数。' +
          '滑杆只是在<b>已经生成好的 ' + manifest.traces.length + ' 组配置之间</b>切换，' +
          '浏览器里不算任何算法量。' +
          '视图组件：残差 shape <code>views/shape-guard.js</code>、' +
          'LayerNorm 轴 <code>views/norm-axis.js</code>、' +
          'SwiGLU 路径 <code>views/swiglu-paths.js</code>、' +
          'Pre/Post 对照 <code>views/norm-contrast.js</code>；' +
          '参数量账本<b>复用</b> L05 的 <code>views/ledger.js</code>（ticket #45）。' +
          '五个组件都不含任何 Decoder Block 专属公式 —— 公式由 trace 传入。' +
          '两条源图 <code>decoder-blocks.png</code>、<code>decode-only.png</code> ' +
          '来自教程 3.7 与 Transformer 架构快速入门，均为可直接复用的纯示意图。';
      })();
    </script>
  </body>
</html>
