<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>L00 · Online Softmax 逐步回放 - AIInfraGuide</title>
    <meta
      name="description"
      content="Online Softmax 的分块递推回放：单步看 m、ℓ、acc 如何用修正因子 e^(m_old − m_new) 逐块更新。"
    />
    <link rel="canonical" href="./00-online-softmax.html" />
    <link rel="stylesheet" href="./assets/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="./assets/engine/lab.css" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        padding: 20px 22px 56px;
        background: #f9fafb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', 'Noto Sans CJK SC', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1120; }
      }
      .lab-back { display: inline-block; margin-bottom: 14px; color: #007aff; font-size: 13.5px; text-decoration: none; }
      .lab-provenance {
        margin-top: 22px;
        padding-top: 14px;
        border-top: 1px solid rgba(128, 128, 128, 0.25);
        color: #6b7280;
        font-size: 12px;
        line-height: 1.6;
      }
      @media (prefers-color-scheme: dark) { .lab-provenance { color: #9ca3af; } }
      .lab-provenance code {
        background: rgba(128, 128, 128, 0.14);
        border-radius: 4px;
        padding: 1px 5px;
        font: 0.92em/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .lab-banner {
        margin: 0 0 14px;
        padding: 8px 12px;
        border: 1px solid rgba(0, 122, 255, 0.35);
        border-radius: 8px;
        background: rgba(0, 122, 255, 0.07);
        font-size: 12.5px;
        color: #1f2937;
      }
      @media (prefers-color-scheme: dark) { .lab-banner { color: #e5e7eb; } }
    </style>
  </head>
  <!--
    Two build-time facts this document depends on, both learned the hard way in
    the scaffolding ticket:

      * The no-index marker must wrap the whole document. On a bare <meta> tag
        Pagefind ignores it and indexes the page anyway.
      * Asset paths are relative to the SERVED location, not to this source
        file: scripts/build-labs.mjs flattens labs/pages/*.html to
        public/labs/*.html, so this page lands beside assets/ and must use
        ./assets/… — a ../ would 404 the whole engine.

    The page holds a trace and a config. Every algorithmic decision — state
    reconstruction, layout, formula tiers, playback — lives in the engine.
  -->
  <body data-pagefind-ignore>
    <a class="lab-back" href="./">← 全部实验室</a>
    <p class="lab-banner" id="lab-banner" hidden></p>

    <main id="lab"></main>

    <p class="lab-provenance">
      本页每个数字都来自一次真实的 numpy 运行，不是手编的演示数据。
      trace 由 <code>labs/traces/online_softmax.py</code> 生成：它用 numpy 跑分块 online
      softmax 递推，并对 <b>torch</b> 的参考实现逐块断言（每块结束后单独出断言，而不是只对最终结果 ——
      只对最终值的话，两个互相抵消的错误一样能通过）。
      引擎本身在 <code>labs/assets/engine/</code>，不含任何 Online Softmax 专属逻辑。
    </p>

    <!-- KaTeX is vendored, never a CDN: a lab page must make zero external requests. -->
    <script src="./assets/vendor/katex/katex.min.js"></script>
    <script src="./assets/engine/trace-model.js"></script>
    <script src="./assets/engine/layout.js"></script>
    <script src="./assets/engine/formula.js"></script>
    <script src="./assets/engine/dag.js"></script>
    <script src="./assets/engine/tensors.js"></script>
    <script src="./assets/engine/narrow.js"></script>
    <script src="./assets/engine/player.js"></script>
    <script src="./assets/engine/verify.js"></script>

    <!--
      The trace is substituted here at build time from labs/traces/<name>.json
      (see the trace-inlining step in scripts/build-labs.mjs). Inlining it —
      rather than fetching it — is what makes "the lab page is data plus config"
      literally true, and it makes trace/page drift impossible: the page cannot
      disagree with the JSON it was built from.
    -->
    <!-- trace:online-softmax -->

    <script>
      (function () {
        'use strict';
        var traces = window.LabTraces || {};
        var trace = traces['online-softmax'];
        if (!trace) {
          document.getElementById('lab').textContent = 'trace 未加载：assets/traces/online-softmax.js 缺失。';
          return;
        }

        var banner = document.getElementById('lab-banner');
        var params = new URLSearchParams(location.search);
        var badStep = params.get('step');
        if (badStep !== null && (isNaN(parseInt(badStep, 10)) ||
            parseInt(badStep, 10) < 0 || parseInt(badStep, 10) > trace.steps.length - 1)) {
          banner.hidden = false;
          banner.textContent = '深链里的 ?step=' + badStep + ' 超出范围（本 trace 共 ' +
            trace.steps.length + ' 步），已停在第一步。';
        }

        var player = LabEngine.lab(trace, {
          mount: '#lab',
          title: 'Online Softmax 逐步回放',
          lead: '把三遍扫描的 Safe Softmax 改造成分块递推：每来一块，先用新的最大值修正历史统计量，' +
                '再并入本块。L00 是整个实验室的第一课，也是 L06 FlashAttention 的前置。',
          tier: 'num',
          tutorial: {
            href: '/AIInfraGuide/cuda/模块二-cuda编程与算子优化/52-cuda-online-softmax实现',
            label: '返回教程正文：5.2 CUDA Online Softmax 实现'
          }
        });

        /* Compact proof panel. It carries the control group, so a green verdict
           here means something -- see labs/assets/engine/verify.js. */
        var proof = document.createElement('section');
        proof.className = 'lab-panel lab-panel-extra';
        proof.innerHTML = '<div class="lab-panel-hd"><span class="lab-panel-t">自检 · 引擎正确性</span>' +
          '<span class="lab-panel-sub">在浏览器里真跑，不是预期值</span></div>' +
          '<div class="lab-panel-bd" style="padding:10px 12px"></div>';
        document.getElementById('lab').appendChild(proof);
        LabEngine.verify.panel(proof.querySelector('.lab-panel-bd'), trace, player.index);

        /* The player handle, for the acceptance harness in verify.py. Exposing
         * it is harmless in production and it is the only way the harness can
         * assert against the same object the page drives, rather than against a
         * re-implementation of it. */
        window.__p = player;
        window.__labTrace = trace;
      })();
    </script>
  </body>
</html>
