name: Trace checks

# Deliberately separate from the deploy workflow. Deploy runs only on `main`
# and must not be blocked by — or slow down — numeric checks; and a trace
# problem is exactly the kind of thing that should surface on a PR, not after
# it has already landed. See the decision record on issue #37.
on:
  pull_request:
  push:
    branches:
      - 'feat/**'
      - 'research/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traces:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CPU-only torch. The full package with CUDA is several hundred MB and
      # nothing here needs a GPU — the traces are reference arithmetic, not
      # kernels.
      #
      # numpy is pinned to <2 and that pin is LOAD-BEARING, not tidiness.
      # `torch==2.2.0+cpu` is compiled against the numpy 1.x ABI. An unpinned
      # numpy resolves to 2.x, and the generators then die at the first crossing
      # of torch's numpy bridge (`torch.from_numpy`, `.numpy()`) with
      # "RuntimeError: Numpy is not available" — after having imported torch and
      # run every pure-torch operation successfully, so it reads as a broken
      # script rather than as a version skew, and it is not reproducible on a
      # machine with a pinned numpy. The failure is in the GENERATORS' reference
      # checks, i.e. in this job's whole purpose.
      #
      # (If torch is ever bumped, bump this pin with it: the constraint is the
      # pair, not numpy on its own.)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2" "torch==2.2.0" --index-url https://download.pytorch.org/whl/cpu

      # Every generator asserts its trace against an independent torch
      # implementation and lints it against the engine's data contract, so a
      # non-zero exit here means the numbers on a lab page no longer match the
      # algorithm they claim to replay.
      - name: Generate traces and check against reference implementations
        run: |
          for script in labs/traces/*.py; do
            echo "::group::$script"
            python "$script"
            echo "::endgroup::"
          done

      # The generated JSON is committed, and the pages are built from it, so a
      # hand-edited or stale JSON would ship. Re-running the generators above
      # must reproduce it byte for byte. The scripts are deterministic by
      # construction (fixed inputs, no sampling), which is what makes this a
      # valid check rather than a flaky one.
      - name: Check that committed traces are up to date
        run: |
          if ! git diff --exit-code -- labs/traces/; then
            echo "::error::A committed trace does not match its generator's output."
            echo "Run the scripts in labs/traces/ and commit the regenerated JSON."
            exit 1
          fi
